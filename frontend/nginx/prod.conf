# Nginx de PRODUCCIÓN (contenedor «proxy»): único punto de entrada (despliegue, p. 52, y
# Seguridad, p. 54). Sirve el build estático del frontend y deriva /api a la API por la red
# interna. El TLS (Let's Encrypt en el 443) llega con la sesión de deploy: ver Pendientes en
# CLAUDE.md.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP en modo Report-Only (como GO7): reporta en la consola sin bloquear, hasta
    # calibrarla. Las teselas vienen de OpenStreetMap y Leaflet usa estilos inline.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        include /etc/nginx/snippets/api.inc;
    }

    # Archivos con hash en el nombre (los genera Vite): se cachean sin vencimiento. `expires`
    # (y no add_header) para no anular los headers de seguridad heredados del server.
    location /assets/ {
        expires max;
    }

    # Fallback SPA: cualquier ruta del portal devuelve index.html, que no se cachea para que
    # un deploy nuevo se vea sin forzar la recarga.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
