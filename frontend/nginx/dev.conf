# Nginx de DESARROLLO. Misma topología que producción (única entrada, mismo origen), pero el
# frontend lo sirve el dev-server de Vite con hot reload en lugar del build estático.
# Se monta desde docker-compose.yml; producción usa prod.conf.

# Solo se pide "upgrade" cuando el navegador abre un websocket (el del hot reload de Vite).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Igual que prod.conf (D71): a otro origen (las teselas de OpenStreetMap) el navegador manda como mucho
    # el origen, nunca la dirección completa. El token de un enlace va en el fragmento, que nunca se manda;
    # esto es la segunda capa, y explícita, para no depender del valor por defecto de cada navegador.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        include /etc/nginx/snippets/api.inc;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        # Vite rechaza un Host que no conoce ("Blocked request. This host is not allowed"):
        # se le pasa el del navegador (localhost) y no el del upstream (frontend:5173).
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
