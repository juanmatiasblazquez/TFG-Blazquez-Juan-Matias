# Entorno de PRODUCCIÓN: exactamente los tres contenedores del diagrama de despliegue (p. 52).
# Es un archivo independiente, no un override del de desarrollo (docs/decisiones.md, D10).
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# - proxy (Nginx): único punto de entrada y único servicio que publica puertos. Sirve el build
#   estático del frontend y deriva /api a la API.
# - api (FastAPI + motor): solo en la red interna, sin puertos.
# - db (PostgreSQL 17 + PostGIS 3.5): solo en la red interna, sin puertos.
#
# Lee el mismo .env que desarrollo; DB_PASSWORD es obligatoria y no puede ser la de ejemplo.
# El TLS (Let's Encrypt en el 443) llega con la sesión de deploy (Pendientes en CLAUDE.md).
name: trazados

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - publica
      - interna
    logging: *logs

  api:
    build:
      context: ./backend
      additional_contexts:
        motor: ./motor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Fijo: este archivo siempre es producción, así el guard de core/config.py siempre corre.
      APP_ENV: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trazados}
      DB_USER: ${DB_USER:-trazados}
      DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env (una propia, no la de ejemplo)}
      NOMBRE_ESTUDIO: ${NOMBRE_ESTUDIO:-}
    networks:
      - interna
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logs

  db:
    build: ./docker/db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trazados}
      POSTGRES_USER: ${DB_USER:-trazados}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env (una propia, no la de ejemplo)}
    volumes:
      - db_datos:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logs

networks:
  # Red por la que entra el tráfico del navegador: solo el proxy está en ella.
  publica: {}
  # Red interna (proxy ↔ api ↔ db). `internal: true`: sin salida a internet y sin puertos
  # publicables. La API no necesita internet: las teselas de OpenStreetMap las pide el navegador.
  interna:
    internal: true

volumes:
  db_datos:
